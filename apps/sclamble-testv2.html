<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SCLAMBLE 3ラウンド体験版</title>

<style>
:root{
  --bg:#fff4df;
  --paper:#fffaf0;
  --ink:#3f3024;
  --accent:#c85a24;
  --accent2:#f4ae45;
  --line:#e6c796;
  --shadow:0 14px 40px rgba(93,59,27,.14);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    ui-rounded,
    "Hiragino Maru Gothic ProN",
    "Yu Gothic",
    system-ui,
    sans-serif;

  color:var(--ink);

  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(255,255,255,.95),
      transparent 35%
    ),
    linear-gradient(
      180deg,
      #fff8e8,
      #ffe6bd
    );

  min-height:100vh;
}

.app{
  max-width:1040px;
  margin:0 auto;
  padding:10px;
}


/* =========================
   HEADER
========================= */

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:6px;
}

.brand h1{
  margin:0;
  font-size:clamp(24px,3vw,34px);
  letter-spacing:.04em;
  color:#0d7199;
  text-shadow:0 2px 0 white;
}

.brand small{
  display:block;
  color:#7e6a55;
  margin-top:3px;
}

.roundbox{
  background:#fff;
  border:2px solid #f0c77e;
  border-radius:18px;
  padding:7px 10px;
  min-width:130px;
  text-align:center;
  box-shadow:var(--shadow);
}

.roundbox strong{
  font-size:17px;
  color:var(--accent);
}


/* =========================
   LAYOUT
========================= */

.layout{
  display:grid;
  grid-template-columns:
    minmax(0,1.75fr)
    minmax(250px,.72fr);

  gap:10px;
}

.panel{
  background:rgba(255,250,240,.95);
  border:2px solid #efd2a2;
  border-radius:18px;
  box-shadow:var(--shadow);
}


/* =========================
   BOARD
========================= */

.board-panel{
  padding:10px;

  background:
    radial-gradient(
      circle at 22% 18%,
      rgba(255,255,255,.16),
      transparent 30%
    ),
    linear-gradient(
      180deg,
      #8fcf73 0%,
      #6fb457 100%
    );
}

.board-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:7px;
}

.board-title h2{
  margin:0;
  font-size:17px;
  color:#244b20;
}


/* =========================
   LEGEND
========================= */

.legend{
  font-size:12px;
  color:#294d26;

  background:rgba(255,255,255,.74);

  padding:5px 9px;
  border-radius:16px;

  display:flex;
  flex-direction:column;
  align-items:flex-start;

  gap:3px;
}

.legend-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.legend-wolf-row{
  gap:6px;
}

.legend-item{
  display:inline-flex;
  align-items:center;
  gap:4px;
  white-space:nowrap;
}

.legend-chip{
  width:20px;
  height:20px;
  object-fit:contain;
}

.legend-note{
  white-space:nowrap;
}


/* =========================
   BOARD WRAP
========================= */

.board-wrap{
  position:relative;
  aspect-ratio:1/1;
  max-width:600px;
  margin:0 auto;
}


/* =========================
   中央進行ナビ
========================= */

.center-card{
  position:absolute;

  inset:35.5% 35.5%;

  border-radius:18px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:8px;

  background:rgba(255,247,231,.97);

  border:3px dashed #d7a765;

  text-align:center;

  padding:12px;

  color:#9c5b2d;

  z-index:5;

  box-shadow:
    0 8px 20px rgba(91,67,36,.12);
}

.center-guide{
  font-weight:900;
  font-size:14px;
  line-height:1.35;
}

.center-sub{
  font-size:10px;
  color:#7f6a52;
  line-height:1.35;
  min-height:14px;
}

.center-action{
  width:100%;

  border:none;

  border-radius:13px;

  padding:9px 7px;

  font-weight:900;

  cursor:pointer;

  background:#c85a24;

  color:white;

  box-shadow:
    0 4px 10px rgba(0,0,0,.14);
}

.center-action:disabled{
  opacity:.38;
  cursor:not-allowed;
}

.center-action.secondary-state{
  background:#0d7199;
}


/* =========================
   FENCE
========================= */

.fence-card{
  position:absolute;

  width:18%;
  height:auto;

  transform:
    translate(-50%,-50%)
    rotate(var(--rot,0deg));

  background:transparent;

  box-shadow:
    0 5px 14px rgba(0,0,0,.12);

  overflow:visible;

  z-index:1;
}

.fence-card img{
  width:100%;
  height:auto;

  display:block;

  object-fit:contain;
}


/* =========================
   PASTURE
========================= */

.gap-pasture{
  position:absolute;

  width:19%;
  min-height:13%;

  transform:
    translate(-50%,-50%);

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:3px;
  padding:2px;

  z-index:3;

  border-radius:14px;

  transition:
    .15s box-shadow,
    .15s transform;
}

.gap-pasture.battled{
  box-shadow:
    0 0 0 7px rgba(255,72,72,.16);

  transform:
    translate(-50%,-50%)
    scale(1.04);
}

.gap-pasture.target{
  box-shadow:
    0 0 0 5px rgba(255,179,0,.20);
}

.gap-head{
  display:flex;
  align-items:center;
  justify-content:center;

  gap:4px;

  white-space:nowrap;

  font-size:11px;
  font-weight:800;

  color:#5f4b37;

  background:
    rgba(255,255,255,.88);

  border-radius:999px;

  padding:2px 6px;
}

.gap-dot{
  width:9px;
  height:9px;

  border-radius:50%;

  flex:0 0 auto;
}


/* =========================
   SELECT ICON
========================= */

.choice-icons{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;

  gap:3px;

  min-height:18px;
}

.choice-icon{
  width:21px;
  height:21px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:12px;

  background:
    rgba(255,255,255,.92);

  border:
    1px solid rgba(87,63,37,.18);
}


/* =========================
   CHIP
========================= */

.chips{
  display:flex;
  flex-wrap:wrap;

  justify-content:center;
  align-content:flex-start;

  gap:4px;

  min-height:50px;
}

.chip{
  width:34px;
  height:34px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:transparent;

  box-shadow:
    0 2px 5px rgba(0,0,0,.10);
}

.chip img{
  width:100%;
  height:100%;

  display:block;

  object-fit:contain;

  border-radius:50%;

  transform:
    rotate(var(--chip-rotation,0deg));

  transform-origin:center center;
}


/* =========================
   SIDE
========================= */

.side{
  padding:9px;

  display:flex;
  flex-direction:column;

  gap:8px;
}

.section-title{
  font-weight:800;
  color:#915026;

  margin-bottom:4px;
}


/* =========================
   PLAYERS
========================= */

.players{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:5px;
}

.player{
  display:grid;

  grid-template-columns:
    auto 1fr auto;

  gap:6px;

  align-items:center;

  padding:6px 7px;

  background:white;

  border-radius:14px;

  border:
    1px solid #ead8ba;

  min-width:0;
}

.avatar{
  width:28px;
  height:28px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#f4e0bd;

  font-size:15px;

  border:
    1px solid rgba(95,70,38,.18);
}

.player.you{
  border:
    2px solid #0d7199;

  background:#f3fbff;
}

.hut{
  font-size:10px;
  color:#71624f;
}

.pts{
  font-weight:900;
  font-size:12px;
}


/* =========================
   COLOR CARDS
========================= */

.cards{
  display:grid;

  grid-template-columns:
    repeat(6,minmax(0,1fr));

  gap:6px;
}

.cardbtn{
  border:none;

  border-radius:14px;

  padding:8px 4px;

  color:white;

  font-weight:900;

  cursor:pointer;

  min-height:86px;

  writing-mode:vertical-rl;
  text-orientation:upright;

  letter-spacing:.06em;

  box-shadow:
    0 4px 10px rgba(0,0,0,.11);

  transition:
    .15s transform,
    .15s opacity,
    .15s box-shadow;
}

.cardbtn.selected{
  outline:
    4px solid #fff;

  box-shadow:
    0 0 0 3px #3f3024,
    0 6px 14px rgba(0,0,0,.18);

  transform:
    translateY(-2px);
}

.cardbtn:hover{
  transform:
    translateY(-2px);
}

.cardbtn:disabled{
  opacity:.35;

  cursor:not-allowed;

  transform:none;
}


/* =========================
   HELP
========================= */

.step-help{
  margin-top:2px;

  font-size:12px;

  color:#7f6a52;

  line-height:1.45;

  background:#fff8ec;

  border-radius:10px;

  padding:7px 8px;
}


/* =========================
   LOG
========================= */

.log{
  height:150px;

  overflow:auto;

  background:#fff;

  border:
    1px solid #ead8ba;

  border-radius:14px;

  padding:8px;

  font-size:11px;

  line-height:1.55;
}

.log p{
  margin:0 0 4px;
}

.log .major{
  font-weight:900;
  color:#b44819;
}


/* =========================
   REVEAL
========================= */

.reveal-panel{
  margin-bottom:2px;

  padding:6px;

  border-radius:14px;

  background:#fff;

  border:
    2px solid #efd2a2;
}

.reveal-head{
  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:10px;

  margin-bottom:6px;
}

.reveal-head strong{
  color:#915026;
}

#phaseText{
  font-size:12px;

  color:#7f6a52;

  text-align:right;
}

.reveal-grid{
  display:grid;

  grid-template-columns:
    repeat(6,1fr);

  gap:7px;
}

.reveal-card{
  border-radius:12px;

  padding:5px 4px;

  text-align:center;

  border:
    1px solid #ead8ba;

  background:#faf7f0;

  min-height:50px;

  display:flex;

  flex-direction:column;

  justify-content:center;

  gap:5px;
}

.reveal-card.you{
  border:
    2px solid #0d7199;

  background:#f3fbff;
}

.reveal-name{
  font-size:12px;

  font-weight:800;
}

.reveal-color{
  color:white;

  border-radius:10px;

  padding:5px 3px;

  font-weight:900;

  box-shadow:
    inset 0 -2px 0 rgba(0,0,0,.10);
}

.reveal-hidden{
  color:#8a7a67;

  font-weight:700;

  font-size:11px;
}


/* =========================
   CPU NOTE
========================= */

.cpu-note{
  font-size:12px;

  line-height:1.5;

  background:#fff5df;

  border-radius:12px;

  padding:9px;
}


/* =========================
   RESET
========================= */

.secondary{
  border:none;

  border-radius:14px;

  padding:8px 10px;

  font-weight:900;

  cursor:pointer;

  background:#f2ddbc;

  color:#68472c;
}

.reset-row{
  display:flex;
  justify-content:flex-end;
}


/* =========================
   RESULT
========================= */

.overlay{
  position:fixed;

  inset:0;

  background:
    rgba(47,32,20,.55);

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  z-index:20;
}

.overlay.show{
  display:flex;
}

.modal{
  background:#fffaf0;

  border-radius:26px;

  padding:22px;

  max-width:620px;

  width:100%;

  box-shadow:
    0 24px 70px rgba(0,0,0,.30);

  border:
    3px solid #efc884;
}

.modal h2{
  margin-top:0;

  color:#0d7199;
}

.results{
  display:grid;

  gap:6px;

  margin:15px 0;
}

.result{
  display:flex;

  justify-content:space-between;
  align-items:center;

  padding:10px 12px;

  border-radius:14px;

  background:#fff;

  border:
    1px solid #ead8ba;
}

.result.win{
  border:
    3px solid #f2b640;

  background:#fff8d9;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-height:780px) and (min-width:861px){

  .log{
    height:110px;
  }

  .board-wrap{
    max-width:540px;
  }

  .cpu-note{
    font-size:10px;

    padding:6px;
  }
}


@media(max-width:860px){

  .layout{
    grid-template-columns:1fr;
  }

  .board-wrap{
    max-width:640px;
  }
}


@media(max-width:560px){

  .side{
    display:flex;
    flex-direction:column;
  }

  .cards-section{
    order:1;
  }

  .reveal-panel{
    order:2;
  }

  .step-help{
    order:3;
  }

  .players-section{
    order:4;
  }

  .log-section{
    order:5;
  }

  .cpu-note{
    order:6;
  }

  .reset-row{
    order:7;
  }

  .board-wrap{
    width:100%;

    max-width:100%;

    aspect-ratio:1/1.05;
  }

  .fence-card{
    width:21%;
  }

  .gap-pasture{
    width:21%;
  }

  .chip{
    width:27px;
    height:27px;
  }

  .choice-icon{
    width:17px;
    height:17px;

    font-size:9px;
  }

  .gap-head{
    font-size:9px;

    padding:1px 4px;
  }

  .center-card{
    inset:34.5% 34.5%;

    padding:8px;

    gap:6px;
  }

  .center-guide{
    font-size:12px;
  }

  .center-sub{
    font-size:9px;
  }

  .center-action{
    font-size:11px;

    padding:7px 5px;
  }

  .cards{
    gap:4px;
  }

  .cardbtn{
    min-height:76px;

    padding:6px 2px;

    font-size:11px;
  }

  .legend{
    font-size:11px;

    padding:4px 6px;
  }

  .legend-row{
    gap:6px;
  }

  .legend-chip{
    width:18px;
    height:18px;
  }

}
</style>
</head>


<body>

<div class="app">


<header>

  <div class="brand">

    <h1>
      SCLAMBLE
    </h1>

    <small>
      6人プレイ / 3ラウンド体験版
    </small>

  </div>


  <div class="roundbox">

    ROUND

    <br>

    <strong id="roundLabel">
      1 / 3
    </strong>

  </div>

</header>



<div class="layout">


<section class="panel board-panel">


  <div class="board-title">

    <h2>
      牧場
    </h2>


    <div class="legend">

      <div class="legend-row">

        <span class="legend-item">

          <img
            class="legend-chip"
            src="../assets/white_chip.jpg"
            alt="白羊"
          >

          白=1点

        </span>


        <span class="legend-item">

          <img
            class="legend-chip"
            src="../assets/red_chip.jpg"
            alt="赤羊"
          >

          赤=2点

        </span>


        <span class="legend-item">

          <img
            class="legend-chip"
            src="../assets/gold_chip.jpg"
            alt="金羊"
          >

          金=3点

        </span>

      </div>


      <div class="legend-row legend-wolf-row">

        <span class="legend-item">

          <img
            class="legend-chip"
            src="../assets/wolf_right_chip.jpg"
            alt="オオカミ"
          >

          =0点

        </span>


        <span class="legend-note">
          (3匹集めると羊を失う)
        </span>

      </div>

    </div>

  </div>



  <div
    class="board-wrap"
    id="board"
  >

    <div class="center-card">

      <div
        class="center-guide"
        id="centerGuide"
      >
        色カードを選ぼう！
      </div>


      <div
        class="center-sub"
        id="centerSub"
      >
        決定するまでは変更できます
      </div>


      <button
        class="center-action"
        id="centerActionBtn"
        disabled
      >
        色を決定する
      </button>

    </div>

  </div>

</section>



<aside class="panel side">


  <div class="players-section">

    <div class="section-title">
      プレイヤー
    </div>


    <div
      class="players"
      id="players"
    ></div>

  </div>



  <div class="cards-section">

    <div class="section-title">
      あなたの色カード
    </div>


    <div
      class="cards"
      id="cards"
    ></div>

  </div>



  <div
    class="reveal-panel"
    id="revealPanel"
  >

    <div class="reveal-head">

      <strong>
        今回のカード
      </strong>


      <span id="phaseText">
        色カードを1枚選んでください
      </span>

    </div>


    <div
      class="reveal-grid"
      id="revealGrid"
    ></div>

  </div>



  <div
    class="step-help"
    id="stepHelp"
  ></div>



  <div class="log-section">

    <div class="section-title">
      ゲームログ
    </div>


    <div
      class="log"
      id="log"
    ></div>

  </div>



  <div class="cpu-note">

    CPUは
    「羊の得点価値」
    「オオカミの危険」
    「他者とのバッティング予測」
    にランダムな揺らぎを加えて判断します。

    CPU同士は互いの選択を事前には知りません。

  </div>



  <div class="reset-row">

    <button
      class="secondary"
      id="resetBtn"
      style="display:none"
    >
      最初から
    </button>

  </div>


</aside>


</div>

</div>



<div
  class="overlay"
  id="overlay"
>

  <div class="modal">

    <h2>
      体験版 終了！
    </h2>


    <p>
      3ラウンド終了です。
      製品版では全6ラウンド、
      5・6ラウンド目に各牧場へ2チップ追加されます。
    </p>


    <div
      class="results"
      id="results"
    ></div>


    <button
      class="center-action"
      id="replayBtn"
    >
      もう一度遊ぶ
    </button>

  </div>

</div>



<script>

/* =========================
   COLORS
========================= */

const COLORS=[

  {
    id:'yellow',
    name:'黄',
    hex:'#e4c400',
    soft:'#fff4a8'
  },

  {
    id:'green',
    name:'緑',
    hex:'#28a84b',
    soft:'#d9f3dc'
  },

  {
    id:'cyan',
    name:'水',
    hex:'#17a6d1',
    soft:'#d8f2fa'
  },

  {
    id:'red',
    name:'赤',
    hex:'#e83f43',
    soft:'#ffdcdc'
  },

  {
    id:'blue',
    name:'青',
    hex:'#2348b8',
    soft:'#dde4ff'
  },

  {
    id:'pink',
    name:'桃',
    hex:'#d83aa8',
    soft:'#f8dcf1'
  }

];


const PLAYER_AVATAR_BG=[

  '#dff4ff',
  '#ffe6cc',
  '#efe6d8',
  '#fde8f2',
  '#e7f0ff',
  '#e3f6e4'

];


const ANIMALS={

  white:{
    label:'白羊',
    score:1,
    img:'../assets/white_chip.jpg'
  },

  red:{
    label:'赤羊',
    score:2,
    img:'../assets/red_chip.jpg'
  },

  gold:{
    label:'金羊',
    score:3,
    img:'../assets/gold_chip.jpg'
  },

  wolf:{
    label:'オオカミ',
    score:0,
    imgLeft:'../assets/wolf_left_chip.jpg',
    imgRight:'../assets/wolf_right_chip.jpg'
  }

};


let game;



/* =========================
   BAG
========================= */

function freshBag(){

  const spec=[

    ['white',18],
    ['red',6],
    ['gold',18],
    ['wolf',6]

  ];


  let bag=[];

  let id=0;


  for(const [type,count] of spec){

    for(let i=0;i<count;i++){

      bag.push({

        id:++id,

        type,

        dir:
          Math.random()<.5
            ? -1
            : 1

      });

    }

  }


  return shuffle(bag);

}



function shuffle(a){

  a=[...a];


  for(let i=a.length-1;i>0;i--){

    const j=
      Math.floor(
        Math.random()*(i+1)
      );


    [
      a[i],
      a[j]
    ]=[
      a[j],
      a[i]
    ];

  }


  return a;

}



/* =========================
   NEW GAME
========================= */

function newGame(){

  document
    .getElementById('overlay')
    .classList
    .remove('show');

/* =========================
   DRAW
========================= */

function drawTo(
  colorId,
  number
){

  for(
    let i=0;
    i<number;
    i++
  ){

    if(
      !game.bag.length
    ){

      break;

    }


    game
      .pastures[
        colorId
      ]
      .push(
        game.bag.pop()
      );

  }

}



/* =========================
   SCORE
========================= */

function scoreChips(chips){

  return chips.reduce(

    (
      total,
      chip
    )=>

      total
      +
      ANIMALS[
        chip.type
      ].score,

    0

  );

}



function countType(
  chips,
  type
){

  return chips.filter(
    chip=>
      chip.type===type
  ).length;

}

){

/* =========================
   CPU
========================= */

function cpuChoice(
  cpuIndex
){

  const me=

    game.players[
      cpuIndex
    ];


  const wolfCount=

    countType(
      me.hut,
      'wolf'
    );



  const scored=

    COLORS.map(
      color=>{

        const chips=

          game.pastures[
            color.id
          ];


        const sheepValue=

          scoreChips(
            chips
          );


        const wolves=

          countType(
            chips,
            'wolf'
          );



        let wolfRisk=

          wolves

          *

          (
            .7
            +
            wolfCount
            *
            1.15
          );



        if(
          wolfCount
          +
          wolves
          >=
          3
        ){

          wolfRisk+=5.5;

        }



        const attractiveness=

          sheepValue

          -

          wolves
          *
          .5;



        const crowdRisk=

          Math.max(
            0,
            attractiveness-2
          )

          *

          .32;



        const noise=

          (
            Math.random()
            *
            2
            -
            1
          )

          *

          2.2;



        const greed=

          [
            1.00,
            1.10,
            .95,
            1.18,
            .88
          ][
            cpuIndex-1
          ]

          ||

          1;



        const caution=

          [
            1.00,
            .85,
            1.20,
            .75,
            1.10
          ][
            cpuIndex-1
          ]

          ||

          1;



        return {

          id:
            color.id,

          value:

            sheepValue
            *
            greed

            -

            wolfRisk
            *
            caution

            -

            crowdRisk

            +

            noise

        };

      }
    );



  scored.sort(
    (
      a,
      b
    )=>

      b.value
      -
      a.value
  );


  return scored[0].id;

}



/* =========================
   色確定
========================= */

function confirmColorSelection(){

  if(

    game.busy

    ||

    game.step!=='choose'

    ||

    !game.pendingHumanColor

  ){

    return;

  }



  const humanColor=

    game.pendingHumanColor;


  game.busy=
    true;



  log(

    `<span class="major">

      ROUND ${game.round}

    </span>

    あなたは「${colorName(humanColor)}」を選びました。`

  );



  const choices=[

    humanColor

  ];



  for(
    let i=1;
    i<6;
    i++
  ){

    choices.push(
      cpuChoice(i)
    );

  }



  game.currentChoices=
    choices;


  game.pendingHumanColor=
    null;



  const counts={};



  choices.forEach(
    colorId=>{

      counts[colorId]=

        (
          counts[colorId]
          ||
          0
        )

        +

        1;

    }
  );



  game.pendingCounts=
    counts;



  game.pendingBattled=

    Object.keys(
      counts
    )

    .filter(
      colorId=>
        counts[colorId]>=2
    );



  game.step=
    'locked';


  game.busy=
    false;



  log(
    '全員の選択が完了しました。中央のボタンからカードを公開してください。'
  );


  render();

}

  const battled=

    new Set(
      game.pendingBattled
    );



  const original=

    Object.fromEntries(

      COLORS.map(
        color=>[
          color.id,
          [
            ...game.pastures[
              color.id
            ]
          ]
        ]
      )

    );



  const movedPastures=

    Object.fromEntries(

      COLORS.map(
        color=>[
          color.id,

          battled.has(
            color.id
          )

            ? []

            : [
                ...original[
                  color.id
                ]
              ]

        ]
      )

    );



  for(
    const colorId
    of battled
  ){

    const index=

      COLORS.findIndex(
        color=>
          color.id===colorId
      );



    for(
      const chip
      of original[
        colorId
      ]
    ){

      let currentIndex=
        index;



      for(
        let step=0;
        step<COLORS.length;
        step++
      ){

        currentIndex=

          (
            currentIndex
            +
            chip.dir
            +
            COLORS.length
          )

          %

          COLORS.length;



        const destination=

          COLORS[
            currentIndex
          ].id;



        if(
          !battled.has(
            destination
          )
        ){

          movedPastures[
            destination
          ]
          .push(
            chip
          );


          break;

        }

      }

    }

  }



  game.pastures=
    movedPastures;



  game.step=
    'move';



  log(

    battled.size

      ? 'バッティングした牧場のチップを、向いている方向へ移動しました。'

      : '移動するチップはありません。'

  );


  render();

}



/* =========================
   チップ獲得
========================= */

function processAcquireStep(){

  const choices=

    game.currentChoices;


  const counts=

    game.pendingCounts;



  for(
    let i=0;
    i<choices.length;
    i++
  ){

    const colorId=

      choices[i];



    if(
      counts[colorId]===1
    ){

      const obtained=[

        ...game.pastures[
          colorId
        ]

      ];



      game.pastures[
        colorId
      ]=[];



      if(
        obtained.length
      ){

        game.players[i]
          .hut
          .push(
            ...obtained
          );


        log(

          `${game.players[i].name} が ${colorName(colorId)}牧場から ${obtained.length}枚 獲得。`

        );

      }

      else{

        log(

          `${game.players[i].name} の ${colorName(colorId)}牧場は空でした。`

        );

      }

    }

  }



  resolveWolfBursts();



  game.step=
    'acquire';


  render();

}



/* =========================
   ROUND END
========================= */

function finishRoundStep(){

  game.step=
    'roundEnd';



  log(

    `<span class="major">

      ROUND ${game.round} の処理終了。

    </span>

    盤面と各プレイヤーの小屋を確認してください。`

  );


  render();

}



/* =========================
   中央ボタン
========================= */

function advanceCentralAction(){

  if(
    game.busy
  ){

    return;

  }



  if(
    game.step==='choose'
  ){

    confirmColorSelection();

  }


  else if(
    game.step==='locked'
  ){

    processRevealStep();

  }


  else if(
    game.step==='reveal'
  ){

    processMoveStep();

  }


  else if(
    game.step==='move'
  ){

    processAcquireStep();

  }


  else if(
    game.step==='acquire'
  ){

    finishRoundStep();

  }


  else if(
    game.step==='roundEnd'
  ){

    advanceRound();

  }

}



/* =========================
   WOLF BURST
========================= */

function resolveWolfBursts(){

  const bursting=

    game.players

      .map(
        (
          player,
          index
        )=>

          countType(
            player.hut,
            'wolf'
          )
          >=
          3

            ? index

            : -1

      )

      .filter(
        index=>
          index>=0
      );



  if(
    !bursting.length
  ){

    return;

  }



  const originalHuts=

    game.players.map(
      player=>[
        ...player.hut
      ]
    );



  const transfers=

    game.players.map(
      ()=>[]
    );



  const newHuts=

    originalHuts.map(
      hut=>[
        ...hut
      ]
    );



  for(
    const index
    of bursting
  ){

    const hut=
      originalHuts[
        index
      ];



    const wolves=

      hut.filter(
        chip=>
          chip.type==='wolf'
      );



    const sheep=

      hut.filter(
        chip=>
          chip.type!=='wolf'
      );



    newHuts[
      index
    ]=[];



    sheep.forEach(
      chip=>{

        const destination=

          (
            index
            +
            chip.dir
            +
            game.players.length
          )

          %

          game.players.length;



        transfers[
          destination
        ]
        .push(
          chip
        );

      }
    );



    log(

      `🐺 <span class="major">${game.players[index].name} にオオカミが3匹以上！</span> 羊${sheep.length}枚が隣の小屋へ逃げ、狼${wolves.length}枚は除外。`

    );

  }



  for(
    let i=0;
    i<game.players.length;
    i++
  ){

    if(
      !bursting.includes(i)
    ){

      newHuts[i]=[

        ...originalHuts[i]

      ];

    }



    newHuts[i]
      .push(
        ...transfers[i]
      );



    game.players[i].hut=
      newHuts[i];

  }

}



/* =========================
   NEXT ROUND
========================= */

function advanceRound(){

  if(
    game.step!=='roundEnd'
  ){

    return;

  }



  if(
    game.round===3
  ){

    endGame();

    return;

  }



  game.busy=
    true;



  nightWolfMove();



  log(
    '🌙 夜：牧場に残ったオオカミが向いている方向へ1牧場移動。'
  );



  const nextRound=

    game.round+1;



  const addCount=

    nextRound===3

      ? 2

      : 1;



  COLORS.forEach(
    color=>
      drawTo(
        color.id,
        addCount
      )
  );



  log(

    `ROUND ${nextRound}準備：各牧場に ${addCount}枚追加。`

    +

    `${
      nextRound===3
        ? '（製品版の5・6ラウンド目を模倣）'
        : ''
    }`

  );



  game.round=
    nextRound;


  game.currentChoices=
    null;


  game.pendingHumanColor=
    null;


  game.pendingCounts=
    null;


  game.pendingBattled=
    [];


  game.step=
    'choose';


  game.busy=
    false;


  render();

}



/* =========================
   NIGHT WOLF
========================= */

function nightWolfMove(){

  const original=

    Object.fromEntries(

      COLORS.map(
        color=>[
          color.id,
          [
            ...game.pastures[
              color.id
            ]
          ]
        ]
      )

    );



  const next=

    Object.fromEntries(

      COLORS.map(
        color=>[
          color.id,

          original[
            color.id
          ]
          .filter(
            chip=>
              chip.type!=='wolf'
          )
        ]
      )

    );



  COLORS.forEach(
    (
      color,
      index
    )=>{

      original[
        color.id
      ]

      .filter(
        chip=>
          chip.type==='wolf'
      )

      .forEach(
        chip=>{

          const destinationIndex=

            (
              index
              +
              chip.dir
              +
              COLORS.length
            )

            %

            COLORS.length;



          next[
            COLORS[
              destinationIndex
            ].id
          ]

          .push(
            chip
          );

        }
      );

    }
  );



  game.pastures=
    next;

}



/* =========================
   END GAME
========================= */

function endGame(){

  game.busy=
    true;


  game.currentChoices=
    null;


  game.pendingHumanColor=
    null;


  game.step=
    'ended';


  render();



  const ranked=

    game.players

      .map(
        (
          player,
          index
        )=>({

          index,

          name:
            player.name,

          avatar:
            player.avatar,

          score:
            scoreChips(
              player.hut
            ),

          sheep:
            player.hut

              .filter(
                chip=>
                  chip.type!=='wolf'
              )

              .length

        })
      )

      .sort(
        (
          a,
          b
        )=>

          b.score
          -
          a.score

          ||

          b.sheep
          -
          a.sheep
      );



  const bestScore=
    ranked[0].score;


  const bestSheep=
    ranked[0].sheep;



  const winners=

    ranked

      .filter(
        result=>

          result.score
          ===
          bestScore

          &&

          result.sheep
          ===
          bestSheep
      )

      .map(
        result=>
          result.index
      );



  const box=

    document.getElementById(
      'results'
    );



  box.innerHTML=

    ranked

      .map(
        (
          result,
          rank
        )=>`

        <div
          class="
            result
            ${
              winners.includes(
                result.index
              )
                ? 'win'
                : ''
            }
          "
        >

          <span>

            ${rank+1}位　

            ${result.avatar}

            ${result.name}

            ${
              winners.includes(
                result.index
              )
                ? ' 🏆'
                : ''
            }

          </span>


          <strong>

            ${result.score}点
            /
            羊${result.sheep}枚

          </strong>

        </div>

      `
      )

      .join('');



  log(

    '<span class="major">3ラウンド終了！</span> 得点計算へ。'

  );



  document
    .getElementById(
      'overlay'
    )
    .classList
    .add(
      'show'
    );



  const resetBtn=

    document.getElementById(
      'resetBtn'
    );


  if(
    resetBtn
  ){

    resetBtn.style.display=
      'inline-block';

  }

}



/* =========================
   EVENT
========================= */

document
  .getElementById(
    'centerActionBtn'
  )
  .onclick=
    advanceCentralAction;



document
  .getElementById(
    'resetBtn'
  )
  .onclick=
    newGame;



document
  .getElementById(
    'replayBtn'
  )
  .onclick=
    ()=>{

      document
        .getElementById(
          'overlay'
        )
        .classList
        .remove(
          'show'
        );


      newGame();

    };



newGame();

</script>
